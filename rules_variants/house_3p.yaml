# Одесский покер — правила. Источник истины для движка (engine/rules.py).
# Все спорные пункты вынесены во флаги. Таблица вариантов — в README.md.
# ВАРИАНТ ДЛЯ 3 ИГРОКОВ (max 12 карт: 1..11, 3×12, 11..1, 3 тёмных). Использовать: ODESSA_RULES=rules_variants/house_3p.yaml
# ДЕФОЛТ = правила нашей компании (2026-11-07): козырь всегда бубны, джокер 7♠, заход джокером — только «старшую масти X»,
# в ответ джокер играется как старший джокер или как обычная 7♠. Прежний «классический» вариант: rules_variants/classic.yaml

n_players: 3                 # 3..6
deck:
  ranks: [6, 7, 8, 9, 10, J, Q, K, A]   # 36 карт, 4 масти
  jokers: ["7S"]             # карты, работающие как джокер (0..2). [] = без джокера. Вариант: ["6S"]

schedule:
  # max = 36 // n_players
  ascending: true            # 1,2,...,max-1
  max_repeats: null          # сколько раздач по max подряд (null = n_players). max входит сюда, а не в ascending.
  descending: true           # max-1,...,1
  special:                   # спецраунды после основной части (все по max карт); count null = n_players
    - {type: dark, count: null}      # тёмная (при фиксированном козыре бескозырок нет; вариант: {type: notrump, count: null})

trump:
  mode: fixed                # fixed: козырь всегда fixed_suit; turned: следующая открытая карта после раздачи
  fixed_suit: D              # бубны
  joker_turned: notrump      # (для mode: turned) открыт джокер -> бескозырка
  no_cards_left: notrump     # карт не осталось -> бескозырка. Вариант: dealer_last (козырь = масть последней карты сдающего)

bidding:
  dealer_hook: true          # последний заказывающий не может сделать сумму заказов == n_cards
  hook_min_cards: 4          # ...но только если в раздаче >= 4 карт (1–3 карты: сдающий заказывает что угодно)
  dark_sees_trump: true      # в тёмной заказывают до просмотра своих карт, но открытый козырь видят

play:
  must_follow: true          # обязательно в масть
  must_trump: true           # нет масти -> обязательно козырь
  joker_any_time: true       # джокер можно сыграть в любой момент (даже имея масть)
  joker_lead_low: false      # заходя с джокера, можно объявить его младшим (младшая карта названной масти). У нас: нельзя
  joker_follow_low: as_card  # в ответ «не джокером»: as_card = как обычная 7♠ (может взять!), discard = гарантированный сброс
  joker_lead_demand_highest: true   # заход джокером «старший» + масть X: остальные обязаны дать СТАРШУЮ карту масти X
                                    # (нет X -> козырь, нет козыря -> любая). false = просто ходить в масть X.

scoring:
  exact_per_trick: 10        # заказ выполнен ровно: 10 × заказ
  pass_exact: 5              # пас (0) выполнен: 5
  over_per_trick: 1          # перебор: множитель
  over_mode: taken           # taken: при переборе очки = число ВСЕХ взятых взяток (заказ 2, взял 5 -> 5); extra: только за лишние
  under_per_trick: -10       # недобор: -10 × ...
  under_mode: bid            # bid: -10×заказ; missing: -10×(заказ-взятки)
  dark_multiplier: 1         # тёмная без удвоения (у нас); классика: 2
